<!doctype html>
<html lang="zh-CN" data-lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andi.Li photography</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side" id="side">
  <div class="side-top">
    <a class="mark" href="#/">Andi.Li<br>photography</a>
    <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="side-body"><i data-en>Menu</i><i data-zh>目录</i></button>
  </div>
  <div class="side-body" id="side-body">
    <nav class="places" aria-label="Places">
      <a class="label" href="#/"><i data-en>Places</i><i data-zh>地点</i></a>
      <ul id="places"></ul>
    </nav>
    <div class="side-foot">
      <nav class="pages">
        <a href="#/" data-nav="home"><i data-en>All places</i><i data-zh>全部地点</i></a>
        <a href="#/all" data-nav="all"><i data-en>All photographs</i><i data-zh>全部照片</i></a>
        <a href="#/colours" data-nav="colours"><i data-en>Colours</i><i data-zh>色彩</i></a>
        <a href="#/map" data-nav="map"><i data-en>Map</i><i data-zh>地图</i></a>
        <a href="#/about" data-nav="about"><i data-en>About</i><i data-zh>关于</i></a>
      </nav>
      <nav class="elsewhere" id="social" aria-label="Social"></nav>
      <button id="music" type="button" hidden></button>
      <button id="lang" type="button"><i data-en>中文</i><i data-zh>English</i></button>
      <div class="row">
        <span>© <b id="year"></b> Andi.Li photography</span>
        <button id="theme" type="button" aria-label="Toggle light or dark"><i class="dot"></i></button>
      </div>
    </div>
  </div>
</aside>

<main id="view"></main>

<div id="lb" class="lb" hidden>
  <button class="lb-x" type="button" aria-label="Close">×</button>
  <button class="lb-p" type="button" aria-label="Previous">‹</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption><span id="lb-n"></span><span id="lb-t"></span></figcaption>
  </figure>
  <button class="lb-nx" type="button" aria-label="Next">›</button>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
